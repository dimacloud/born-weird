<style>

  :root {
    --bg: #000;
    --fg: #c8ffc8;
    --dim: #8fb08f;
    --hi: #ffff55;
    --cy: #55ffff;
    --mg: #ff55ff;
    --blue: #0000aa;
    --line: #2a4a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: 'VT323', ui-monospace, Menlo, Consolas, monospace;
    font-size: 22px; line-height: 1.25;
    min-height: 100vh; min-height: 100dvh;
  }
  body::after { /* scanlines */
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
  }
  /* Russian: IBM Plex Mono — readable Cyrillic in a terminal mood */
  html[lang=ru] body { font-family: 'Plex', ui-monospace, Menlo, monospace; font-size: 16px; line-height: 1.5; }
  html[lang=ru] body::after { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.08) 2px 3px); }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; padding: 4px 10px; font-size: 18px; }
  html[lang=ru] .top { font-size: 13px; }
  .top .sp { flex: 1; }
  .top button { width: auto; margin: 0; min-height: 44px; min-width: 44px; padding: 2px 10px; font-size: inherit; text-align: center; border: 1px solid #8888ff; color: #fff; background: transparent; }
  .top button[aria-pressed=true] { background: #fff; color: var(--blue); }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 64px; }
  .screen { display: none; animation: flick .25s steps(3); }
  .screen.on { display: block; }
  @keyframes flick { 0% { opacity: 0; } 50% { opacity: .6; } 100% { opacity: 1; } }
  h1 { font-size: 64px; line-height: .95; margin: 6vh 0 8px; color: var(--hi); letter-spacing: 2px; text-shadow: 3px 3px 0 var(--mg); font-weight: normal; font-family: 'VT323', monospace; }
  h2 { font-size: 30px; color: var(--hi); margin: 0 0 12px; font-weight: normal; }
  html[lang=ru] h2 { font-size: 20px; font-weight: 600; line-height: 1.35; }
  h3 { font-size: 24px; color: var(--cy); margin: 0 0 8px; font-weight: normal; }
  html[lang=ru] h3 { font-size: 16px; font-weight: 600; }
  p { margin: 0 0 14px; }
  .muted { color: var(--dim); }
  .tag { color: var(--cy); }
  .hi { color: var(--hi); }
  .small { font-size: 18px; }
  html[lang=ru] .small { font-size: 14px; }
  .bar { background: var(--blue); color: #fff; padding: 2px 8px; display: inline-block; margin-bottom: 14px; }
  .ref { border: 1px dashed var(--mg); color: var(--mg); padding: 10px 12px; margin: 0 0 18px; }
  .ref img { display: block; width: 100%; max-width: 280px; margin: 10px auto; border: 1px solid var(--mg); }
  .ref b { color: var(--hi); font-weight: normal; display: block; }
  html[lang=ru] .ref b { font-weight: 600; }
  .stat { border: 1px solid var(--cy); color: var(--cy); padding: 8px 12px; margin: 0 0 16px; }
  label { display: block; margin: 22px 0 6px; color: var(--cy); }
  input[type=date] {
    font: inherit; font-size: 26px; width: 100%; padding: 10px 12px;
    background: #001400; color: var(--hi); border: 2px solid var(--fg); border-radius: 0;
    color-scheme: dark; min-height: 54px; -webkit-appearance: none; appearance: none; display: block;
  }
  html[lang=ru] input[type=date] { font-size: 20px; }
  button, a.btn {
    font: inherit; font-size: 24px; cursor: pointer; border-radius: 0; text-decoration: none;
    display: block; width: 100%; text-align: left; margin: 10px 0; padding: 12px 14px;
    background: transparent; color: var(--fg); border: 2px solid var(--fg);
  }
  html[lang=ru] button, html[lang=ru] a.btn { font-size: 16px; line-height: 1.4; }
  button:hover, button:focus-visible, a.btn:hover, a.btn:focus-visible { background: var(--fg); color: #000; outline: none; }
  button.primary { background: var(--hi); color: #000; border-color: var(--hi); text-align: center; }
  html[lang=ru] button.primary { font-weight: 600; }
  button.primary:hover, button.primary:focus-visible { background: #fff; border-color: #fff; }
  button.ghost, a.btn.ghost { border-color: var(--line); color: var(--dim); text-align: center; }
  button[aria-pressed=true]:not(.top button) { background: var(--fg); color: #000; }
  button:disabled { opacity: .45; cursor: default; }
  button.chosen:disabled { opacity: 1; background: var(--fg); color: #000; }
  .opt::before { content: '> ' / ''; color: var(--hi); }
  button.chosen.opt::before { color: #000; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > button, .row > a.btn { flex: 1 1 0; text-align: center; min-width: 54px; }
  .err { color: #ff5555; min-height: 1.3em; }
  .type { white-space: pre-wrap; min-height: 6em; }
  .cursor::after { content: '█'; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .outcome { border-left: 3px solid var(--cy); padding: 8px 0 8px 12px; margin: 14px 0 6px; min-height: 3em; }
  .deltas { color: var(--hi); margin: 6px 0 4px; }
  .deltas span { display: inline-block; margin-right: 12px; }
  .hud { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0 16px; font-size: 18px; align-items: center; }
  html[lang=ru] .hud { font-size: 13px; }
  .hud i { display: block; height: 10px; background: #1d2d1d; position: relative; }
  .hud i b { position: absolute; inset: 0 auto 0 0; background: var(--fg); transition: width .4s steps(8); }
  .progress { border: 2px solid var(--fg); height: 26px; margin: 20px 0; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--fg); transition: width 1.4s steps(14); }
  img.artifact { display: block; width: 100%; max-width: 420px; margin: 6px auto 4px; height: auto; border: 2px solid var(--fg); -webkit-touch-callout: default; }
  .hint { text-align: center; }
  .section { border-top: 1px dashed var(--line); margin-top: 26px; padding-top: 18px; }
  .build div { margin: 0 0 8px; }
  .build b { color: var(--cy); font-weight: normal; display: inline-block; min-width: 7.5em; }
  html[lang=ru] .build b { font-weight: 600; min-width: 9em; }
  ol.tl { list-style: none; padding: 0; margin: 0; }
  ol.tl li { margin: 0 0 12px; }
  ol.tl b { color: var(--cy); font-weight: normal; }
  pre.seed { white-space: pre-wrap; background: #001400; border: 1px solid var(--line); padding: 10px; max-height: 200px; overflow: auto; font: inherit; font-size: 15px; color: var(--dim); }
  html[lang=ru] pre.seed { font-size: 13px; }
  details summary { cursor: pointer; color: var(--cy); margin: 12px 0 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--hi); color: #000; padding: 8px 14px; z-index: 20; display: none; max-width: calc(100% - 32px); }
  .glitch { animation: glitch .45s steps(5); }
  @keyframes glitch { 0% { transform: translateX(0); filter: hue-rotate(0); } 25% { transform: translateX(-6px); filter: hue-rotate(90deg); } 50% { transform: translateX(5px); } 75% { transform: translateX(-2px); filter: hue-rotate(200deg); } 100% { transform: none; filter: none; } }
  footer { margin-top: 40px; font-size: 16px; color: var(--dim); }
  html[lang=ru] footer { font-size: 13px; }
  footer a { color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="top">
  <span>BORN_WEIRD.EXE</span><span class="sp"></span>
  <span id="langBox"><button type="button" id="langEn" lang="en">EN</button> <button type="button" id="langRu" lang="ru">RU</button></span>
  <button type="button" id="btnSound" aria-pressed="true"></button>
</div>
<main id="app">

  <section class="screen on" id="s-intro">
    <div class="ref" id="refBanner" hidden></div>
    <div class="stat" id="spawnStat" hidden></div>
    <h1>BORN<br>WEIRD</h1>
    <p class="tag" data-i18n="tagline"></p>
    <p class="muted" data-i18n="subline"></p>
    <label for="dob" data-i18n="dobLabel"></label>
    <input type="date" id="dob" min="1900-01-01" autocomplete="bday">
    <div class="err" id="dobErr" role="alert"></div>
    <button class="primary" id="btnStart" data-i18n="start"></button>
    <p class="small muted" data-i18n="privacy"></p>
  </section>

  <section class="screen" id="s-decode">
    <span class="bar" data-i18n="decodeBar"></span>
    <div class="type" id="decodeText"></div>
    <div class="hud" id="hudDecode"></div>
    <button class="primary" id="btnDecode" disabled data-i18n="enter"></button>
  </section>

  <section class="screen" id="s-stage">
    <span class="bar" id="stageBar"></span>
    <p class="small tag" id="stageBirth" hidden></p>
    <h2 id="stagePrompt" tabindex="-1"></h2>
    <div id="stageOpts"></div>
    <div id="stageOutcome" hidden>
      <div class="outcome type" id="outcomeText"></div>
      <div class="deltas" id="outcomeDeltas"></div>
      <div class="hud" id="hudStage"></div>
      <button class="primary" id="btnNext" disabled></button>
    </div>
  </section>

  <section class="screen" id="s-compile">
    <span class="bar" data-i18n="compileBar"></span>
    <p id="compileText" data-i18n="compileText"></p>
    <div class="progress"><i id="compileBar"></i></div>
  </section>

  <section class="screen" id="s-result">
    <span class="bar" id="resBar"></span>
    <h2 id="resTitle" tabindex="-1"></h2>
    <p class="hi" id="resVerdict"></p>
    <img class="artifact" id="artifact" alt="BORN WEIRD">
    <p class="small muted hint" id="saveHint"></p>
    <button class="primary" id="btnShare" data-i18n="share"></button>
    <div class="row">
      <button class="ghost" id="btnSave" data-i18n="save"></button>
      <button class="ghost" id="btnCopyLink" data-i18n="copyLink"></button>
    </div>
    <p class="small muted" data-i18n="keyExplain"></p>

    <div class="section">
      <h2 data-i18n="hBuild"></h2>
      <div class="build" id="resBuild"></div>
    </div>

    <div class="section">
      <h2 data-i18n="hAI"></h2>
      <p class="muted small" data-i18n="aiExplain"></p>
      <div class="row" role="group" aria-label="AI">
        <button type="button" id="aiChatgpt">ChatGPT</button>
        <button type="button" id="aiClaude">Claude</button>
      </div>
      <a class="btn" id="aiPlan" target="_blank" rel="noopener"></a>
      <a class="btn" id="aiFuture" target="_blank" rel="noopener"></a>
      <a class="btn" id="aiDebuff" target="_blank" rel="noopener"></a>
      <details>
        <summary data-i18n="seedMore"></summary>
        <p class="muted small" data-i18n="seedDesc"></p>
        <div class="row">
          <button id="btnCopySeed" data-i18n="copySeed"></button>
          <button id="btnDlSeed" data-i18n="dlSeed"></button>
        </div>
        <pre class="seed" id="seedPre"></pre>
      </details>
    </div>

    <div class="section">
      <h2 data-i18n="hFuture"></h2>
      <p id="resFuture"></p>
      <ol class="tl" id="resEvents"></ol>
    </div>

    <div class="section" id="fb">
      <h3 data-i18n="fbWorth"></h3>
      <div class="row" id="fbWorth"></div>
      <h3 style="margin-top:16px" data-i18n="fbFeel"></h3>
      <div class="row" id="fbFeel"></div>
      <h3 style="margin-top:16px" data-i18n="fbSend"></h3>
      <div class="row" id="fbSend"></div>
      <p class="muted small" id="fbThanks" hidden data-i18n="fbThanks"></p>
    </div>

    <button class="ghost" id="btnAgain" style="margin-top:28px" data-i18n="again"></button>
  </section>

  <footer>
    <span data-i18n="footer"></span> <a href="https://github.com/dimacloud/born-weird" rel="noopener" data-i18n="builtPublic"></a>.
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="engine.js"></script>
<script>

    const build = $('resBuild'); build.innerHTML = '';
    [[B.cls, result.startClass + ' → ' + result.title], [B.buff, result.buff], [B.debuff, result.debuff], [B.boss, result.boss],
      [B.quest, result.experiment]].concat(result.rarity ? [[B.rare, B.rareText(result.rarity)]] : []).forEach(([k, v]) => {
      const row = document.createElement('div'); const b = document.createElement('b'); b.textContent = k;
      row.appendChild(b); row.appendChild(document.createTextNode(' ' + v)); build.appendChild(row);
    });
    renderAI();
    $('resFuture').textContent = result.future;
    const ol = $('resEvents'); ol.innerHTML = '';
    result.events.forEach(e => {
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = e.stage + ' · ' + e.year + ' — ';
      li.appendChild(b); li.appendChild(document.createTextNode(e.text));
      ol.appendChild(li);
    });
    $('seedPre').textContent = BW.realitySeedMarkdown(result);
    track('reality_seed_viewed');
    buildFeedback();
  }

  const isAbort = e => e && e.name === 'AbortError';
  // Primary share: the key link (works everywhere, carries the referral, opens the card for the friend).
  $('btnShare').addEventListener('click', async () => {
    track('share_clicked'); SND.blip();
    const url = shareUrl(), text = shareText();
    if (navigator.share) {
      try { await navigator.share({ title: 'BORN WEIRD', text, url }); track('share_completed'); return; }
      catch (e) { if (isAbort(e)) { track('share_cancelled'); return; } }
    }
    if (await copyText(text + ' ' + url)) { track('link_copied'); toast(t('tCopied')); }
    else toast(url);
  });
  $('btnCopyLink').addEventListener('click', async () => {
    if (await copyText(shareText() + ' ' + shareUrl())) { track('link_copied'); toast(t('tLink')); } else toast(shareUrl());
  });
  // Save image: phones get the system share sheet with the file only (iOS: "Save Image"); desktop downloads.
  $('btnSave').addEventListener('click', async () => {
    if (!pngBlob) return toast(t('tNoArt'));
    const file = new File([pngBlob], 'born-weird-' + result.id + '.png', { type: 'image/png' });
    if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '' }); track('artifact_saved'); return; }
      catch (e) { if (isAbort(e)) return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(pngBlob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    track('artifact_saved');
    if (isIOS) toast(t('hintIOS'));
  });
  $('btnCopySeed').addEventListener('click', async () => {
    if (await copyText(BW.realitySeedMarkdown(result))) { track('reality_seed_copied'); toast(t('tSeed')); }
    else toast(t('tSeedFail'));
  });
  $('btnDlSeed').addEventListener('click', async () => {
    const md = BW.realitySeedMarkdown(result);
    const name = 'timeline_' + result.id + '.weird.md';
    const file = new File([md], name, { type: 'text/markdown' });
    if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '' }); track('reality_seed_downloaded'); return; }
      catch (e) { if (isAbort(e)) return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    track('reality_seed_downloaded');
  });
  $('btnAgain').addEventListener('click', () => {
    track('restart_clicked');
    fired.forEach(k => { if (/^(founder_)?(ru_)?(simulation_|referred_simulation_|birth_seed|decode_|choice_|artifact_|reality_seed_|share_|link_copied|ai_open_|fb_|feedback_|restart_)/.test(k)) fired.delete(k); });
    run = null; result = null;
    show('s-intro');
  });

  function buildFeedback() {
    const worth = $('fbWorth'), feel = $('fbFeel'), send = $('fbSend');
    worth.innerHTML = ''; feel.innerHTML = ''; send.innerHTML = ''; $('fbThanks').hidden = true;
    const done = { w: false, f: false, s: false };
    const mk = (box, label, ev, k) => {
      const b = document.createElement('button'); b.textContent = label;
      b.addEventListener('click', () => {
        if (done[k]) return; done[k] = true;
        SND.blip();
        track(ev); track('feedback_submitted');
        box.querySelectorAll('button').forEach(x => { x.disabled = x !== b; });
        b.style.background = 'var(--fg)'; b.style.color = '#000';
        $('fbThanks').hidden = false;
      });
      box.appendChild(b);
    };
    [1, 2, 3, 4, 5].forEach(n => mk(worth, String(n), 'fb_worth_' + n, 'w'));
    ['meh', 'weird', 'wtf'].forEach((v, i) => mk(feel, t('feel')[i], 'fb_feel_' + v, 'f'));
    ['yes', 'no'].forEach((v, i) => mk(send, t('yesno')[i], 'fb_send_' + v, 's'));
  }

  // ---------- character card renderer (1080×1920, story format) ----------
  const PALETTES = {
    AUTONOMY:   { sky: ['#1a0533', '#3d0a5c', '#7a1f6b', '#c2410c', '#f59e0b'], m: ['#2b0b3f', '#1a0626', '#0c0212'], g: '#140419', sun: '#ffdd55', acc: '#ff8855' },
    SECURITY:   { sky: ['#000814', '#001d3d', '#003566', '#0a4d68', '#088395'], m: ['#023047', '#011f2e', '#000c14'], g: '#00111a', sun: '#e0fbfc', acc: '#55ffff' },
    CURIOSITY:  { sky: ['#000a05', '#022c22', '#065f46', '#10b981', '#6ee7b7'], m: ['#052e1c', '#021c11', '#000d07'], g: '#001208', sun: '#ccffee', acc: '#55ff99' },
    CREATION:   { sky: ['#12001f', '#3b0764', '#86198f', '#db2777', '#22d3ee'], m: ['#2e0640', '#1a0326', '#0a0010'], g: '#0e0016', sun: '#ffffff', acc: '#ff55ff' },
    CONNECTION: { sky: ['#1c0a00', '#431407', '#9a3412', '#ea580c', '#fdba74'], m: ['#3b1206', '#240a03', '#120400'], g: '#160600', sun: '#fff1b8', acc: '#ffcc55' },
    POWER:      { sky: ['#0a0000', '#2a0000', '#5c0a0a', '#991b1b', '#ef4444'], m: ['#260303', '#160101', '#080000'], g: '#0a0000', sun: '#ffeeee', acc: '#ff5555' },
  };

  function fontReady(l) {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const f = l === 'ru' ? Promise.all([document.fonts.load('600 40px Plex', 'АБВ ABC'), document.fonts.load('400 40px Plex', 'АБВ ABC'), document.fonts.load('40px VT323')])
      : document.fonts.load('40px VT323');
    return Promise.race([f, new Promise(r => setTimeout(r, 1500))]).catch(() => {});
  }

  function drawScene(res) {
    const W = 180, H = 110;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d', { willReadFrequently: true });
    const r = BW.rng(res.artSeed);
    const P = PALETTES[res.primary];
    const HZ = 88; // horizon
    const bands = P.sky.length;
    for (let i = 0; i < bands; i++) {
      x.fillStyle = P.sky[i];
      const y0 = Math.floor(i * 70 / bands), y1 = Math.floor((i + 1) * 70 / bands);
      x.fillRect(0, y0, W, y1 - y0 + 1);
      x.fillStyle = P.sky[Math.min(i + 1, bands - 1)];
      for (let px = (i % 2); px < W; px += 2) x.fillRect(px, y1 - 1, 1, 1);
    }
    const nStars = 30 + Math.floor(r() * 50);
    for (let i = 0; i < nStars; i++) { x.fillStyle = r() < 0.2 ? P.acc : '#ffffff'; x.fillRect(Math.floor(r() * W), Math.floor(r() * 42), 1, 1); }
    const moons = 1 + (r() < 0.45 ? 1 : 0);
    for (let k = 0; k < moons; k++) {
      const cx = 20 + Math.floor(r() * 140), cy = 38 + Math.floor(r() * 18), rad = k ? 3 + Math.floor(r() * 3) : 7 + Math.floor(r() * 7);
      x.fillStyle = k ? P.acc : P.sun;
      for (let yy = -rad; yy <= rad; yy++) for (let xx = -rad; xx <= rad; xx++) if (xx * xx + yy * yy <= rad * rad) x.fillRect(cx + xx, cy + yy, 1, 1);
      if (!k && r() < 0.6) { x.fillStyle = P.sky[2]; for (let s = 2; s < rad; s += 3) x.fillRect(cx - rad, cy + s, rad * 2 + 1, 1); }
    }
    function ridge(base, amp, rough) {
      const pts = new Array(W + 1).fill(0);
      let step = 64;
      for (let i = 0; i <= W; i += step) pts[i] = base + (r() - .5) * amp;
      if (!pts[W]) pts[W] = base;
      let a = amp;
      while (step > 1) {
        const h = step / 2;
        for (let i = h; i <= W; i += step) { const L = pts[i - h], R = pts[Math.min(i + h, W)] || L; pts[i] = (L + R) / 2 + (r() - .5) * a; }
        a *= rough; step = h;
      }
      return pts.map(v => Math.round(v));
    }
    [ridge(62, 22, 0.55), ridge(73, 15, 0.5), ridge(82, 8, 0.5)].forEach((pts, li) => {
      x.fillStyle = P.m[li];
      for (let i = 0; i < W; i++) x.fillRect(i, pts[i], 1, H - pts[i]);
    });
    x.fillStyle = P.g; x.fillRect(0, HZ, W, H - HZ);
    x.fillStyle = P.acc;
    for (let gy = HZ, k = 1; gy < H; gy += k, k++) x.fillRect(0, gy, W, 1);
    for (let gx = -200; gx < 380; gx += 22) for (let gy = HZ; gy < H; gy++) { const tt = (gy - HZ) / (H - HZ); x.fillRect(Math.round(90 + (gx - 90) * (0.15 + tt)), gy, 1, 1); }
    const lx = 110 + Math.floor(r() * 50), ly = HZ;
    const S = (dx, dy, w, h, col) => { x.fillStyle = col; x.fillRect(lx + dx, ly + dy, w, h); };
    const dark = '#000000', lit = P.acc;
    switch (res.primary) {
      case 'POWER': S(-4, -46, 9, 46, dark); S(-2, -54, 5, 8, dark); S(0, -60, 1, 6, lit); for (let w = -40; w < -2; w += 5) { S(-2, w, 1, 2, lit); S(2, w, 1, 2, lit); } break;
      case 'SECURITY': S(-10, -14, 21, 14, dark); S(-6, -18, 13, 4, dark); S(-1, -8, 3, 8, lit); S(-12, -2, 25, 2, dark); break;
      case 'CURIOSITY': S(-3, -36, 7, 36, dark); S(-5, -40, 11, 4, dark); S(-2, -38, 5, 2, lit); x.fillStyle = lit; for (let b = 1; b < 60; b++) x.fillRect(lx + 4 + b, ly - 39 + Math.round(b * -0.25), 1, 1); break;
      case 'CREATION': S(-8, -10, 17, 10, dark); S(-3, -24, 7, 14, dark); S(-12, -30, 2, 30, dark); S(-12, -30, 14, 2, dark); S(1, -20, 2, 2, lit); S(-6, -6, 2, 2, lit); S(4, -6, 2, 2, lit); break;
      case 'CONNECTION': for (let h = -24; h <= 16; h += 10) { S(h, -8, 8, 8, dark); S(h + 1, -11, 6, 3, dark); S(h + 3, -5, 2, 2, lit); } S(-26, -1, 50, 1, lit); break;
      case 'AUTONOMY': x.fillStyle = dark; for (let i = 0; i < 9; i++) x.fillRect(lx - i, ly - 4 - i, 2 * i + 1, 1); S(0, -3, 1, 3, lit); x.fillStyle = lit; for (let rd = 0; rd < 22; rd++) x.fillRect(lx - 30 + rd * 2, H - 1 - Math.floor(rd * 0.9), 2, 1); break;
    }
    const px = lx - 26 - Math.floor(r() * 20), py = HZ;
    x.fillStyle = '#ffffff'; x.fillRect(px, py - 7, 2, 2); x.fillStyle = P.acc; x.fillRect(px - 1, py - 5, 4, 3);
    x.fillStyle = '#ffffff'; x.fillRect(px, py - 2, 1, 2); x.fillRect(px + 2, py - 2, 1, 2);
    const glitches = 2 + Math.floor(r() * 4);
    for (let i = 0; i < glitches; i++) {
      const gy = 46 + Math.floor(r() * (H - 46)), gh = 1 + Math.floor(r() * 3), off = Math.floor((r() - .5) * 24);
      const row = x.getImageData(0, gy, W, gh); x.putImageData(row, off, gy);
    }
    return c;
  }

  function wrap(ctx, text, maxW) {
    const words = String(text).split(' '), lines = []; let cur = '';
    words.forEach(w => { const tt = cur ? cur + ' ' + w : w; if (ctx.measureText(tt).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tt; });
    if (cur) lines.push(cur);
    return lines;
  }
  // Draw text wrapped to at most opt.lines lines, shrinking the font until it fits. Returns the y below the block.
  function block(x, text, opt) {
    let size = opt.size, lines;
    for (; size >= opt.min; size -= 2) { x.font = opt.font(size); lines = wrap(x, text, opt.w); if (lines.length <= opt.lines) break; }
    if (size < opt.min) { size = opt.min; x.font = opt.font(size); lines = wrap(x, text, opt.w); }
    lines = lines.slice(0, opt.lines);
    const lh = Math.round(parseInt(x.font.match(/(\d+)px/)[1], 10) * (opt.lh || 1.2));
    if (opt.dry) return opt.y + lines.length * lh;
    lines.forEach((l, i) => {
      const tx = opt.center ? opt.x + (opt.w - x.measureText(l).width) / 2 : opt.x;
      if (opt.shadow) { x.fillStyle = '#000'; x.fillText(l, tx + 5, opt.y + i * lh + 5); }
      x.fillStyle = opt.color; x.fillText(l, tx, opt.y + i * lh);
    });
    return opt.y + lines.length * lh;
  }

  async function renderArtifact(res) {
    const L = res.lang === 'ru' ? 'ru' : 'en', A = UI[L].art;
    await fontReady(L);
    const W = 1080, H = 1920;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const P = PALETTES[res.primary];
    // EN: VT323 everywhere. RU: IBM Plex Mono (Cyrillic) for text, VT323 for Latin-only HUD strings.
    const VT = px => px + 'px VT323, ui-monospace, monospace';
    const T = L === 'ru' ? px => '600 ' + Math.round(px * 0.62) + 'px Plex, ui-monospace, monospace' : VT;
    const Tn = L === 'ru' ? px => '400 ' + Math.round(px * 0.68) + 'px Plex, ui-monospace, monospace' : VT;
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);

    // title bar
    x.fillStyle = '#0000aa'; x.fillRect(0, 0, W, 70);
    x.fillStyle = '#ffffff'; x.font = VT(44); x.textBaseline = 'middle';
    x.fillText('BORN_WEIRD.EXE', 26, 37);
    x.textAlign = 'right'; x.fillText(res.protocol + ' // ' + res.earth, W - 26, 37); x.textAlign = 'left';
    x.textBaseline = 'top';

    // scene + class label + title over the sky
    const scene = drawScene(res);
    x.imageSmoothingEnabled = false;
    x.drawImage(scene, 0, 70, W, 660);
    const label = A.cls + ' // ' + A.path(res.lifePath) + ' · ' + res.startClass;
    x.font = T(40);
    x.fillStyle = 'rgba(0,0,0,0.75)'; x.fillRect(40, 100, Math.min(W - 80, x.measureText(label).width + 28), L === 'ru' ? 40 : 46);
    x.fillStyle = P.acc; x.fillText(label, 54, L === 'ru' ? 108 : 104);
    block(x, res.title, { x: 50, y: 170, w: W - 100, size: 104, min: 60, lines: 4, lh: 1.0, font: T, color: '#ffff55', shadow: true, center: true });

    // panel
    const py = 740;
    x.strokeStyle = P.acc; x.lineWidth = 5; x.strokeRect(14, py, W - 28, H - py - 16);
    x.lineWidth = 2; x.strokeRect(26, py + 12, W - 52, H - py - 40);

    // verdict
    let y = block(x, '> ' + res.verdict, { x: 60, y: py + 40, w: W - 120, size: 52, min: 30, lines: L === 'ru' ? 2 : 1, font: T, color: '#55ffff' });

    // stats
    y += 26;
    x.font = T(50);
    const labelW = Math.max(...res.scores.map(s => x.measureText(s.label).width)) + 28;
    const barX = 60 + labelW, step = Math.floor((W - 80 - barX) / 10);
    res.scores.forEach((s, i) => {
      const sy = y + i * 52;
      x.font = T(50);
      x.fillStyle = s.dim === res.primary ? '#ffff55' : s.dim === res.rejected ? '#777' : '#c8ffc8';
      x.fillText(s.label, 60, sy + (L === 'ru' ? 8 : 0));
      const n = Math.max(0, Math.round(s.norm * 10));
      for (let b = 0; b < 10; b++) { x.fillStyle = b < n ? (s.dim === res.primary ? '#ffff55' : P.acc) : '#222'; x.fillRect(barX + b * step, sy + 8, step - 6, 30); }
    });
    y += 6 * 52 + 20;

    // build box (measured first, so its height always fits the rows)
    const rows = [[A.buff, res.buff, '#55ff99'], [A.debuff, res.debuff, '#ff7777'], [A.boss, res.boss, '#ff55ff']];
    const rowOpt = (v, yy, dry) => ({ x: 290, y: yy + (L === 'ru' ? 4 : 0), w: W - 380, size: 40, min: 30, lines: 2, lh: 1.1, font: Tn, color: '#ffffff', dry });
    let ry = y + 22;
    rows.forEach(([, v]) => { ry = Math.max(ry + 48, block(x, v, rowOpt(v, ry, true))) + 10; });
    const boxH = ry - y + (res.rarity ? 50 : 8);
    x.fillStyle = '#0a0a0a'; x.fillRect(50, y, W - 100, boxH);
    x.strokeStyle = '#444'; x.lineWidth = 2; x.strokeRect(50, y, W - 100, boxH);
    ry = y + 22;
    rows.forEach(([k, v, col]) => {
      x.font = T(40); x.fillStyle = col; x.fillText(k, 74, ry + (L === 'ru' ? 6 : 0));
      ry = Math.max(ry + 48, block(x, v, rowOpt(v, ry, false))) + 10;
    });
    if (res.rarity) { x.font = T(40); x.fillStyle = '#ffff55'; x.fillText(A.rare(res.rarity), 74, ry); }
    y += boxH + 22;

    // event log (the 10-year outcome)
    const footerTop = H - 30 - 104;
    const evH = Math.max(140, Math.min(240, footerTop - 20 - y));
    x.fillStyle = '#0000aa'; x.fillRect(50, y, W - 100, evH);
    x.strokeStyle = '#ffffff'; x.lineWidth = 3; x.strokeRect(58, y + 8, W - 116, evH - 16);
    x.font = T(36); x.fillStyle = '#55ffff'; x.fillText(A.event(res.events[3].year), 82, y + 28);
    block(x, res.highlight, { x: 82, y: y + 72, w: W - 164, size: 40, min: 24, lines: Math.max(2, Math.floor((evH - 86) / (L === 'ru' ? 32 : 42))), lh: 1.15, font: Tn, color: '#ffffff' });
    y = Math.max(y + evH + 20, footerTop);

    // footer
    x.font = VT(42); x.fillStyle = '#c8ffc8';
    x.fillText('REALITY #' + res.id, 60, y);
    x.textAlign = 'right'; x.fillStyle = '#ffff55'; x.fillText('dimacloud.github.io/born-weird' + (L === 'ru' ? '/ru' : ''), W - 60, y); x.textAlign = 'left';
    x.font = Tn(34); x.fillStyle = '#8fb08f'; x.fillText(A.note, 60, y + 52);
    if (y + 100 > H - 30) console.warn('card overflow', y);

    // scanlines
    x.fillStyle = 'rgba(0,0,0,0.16)';
    for (let yy = 0; yy < H; yy += 4) x.fillRect(0, yy, W, 2);

    return await new Promise((resolve, reject) => c.toBlob(b => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png'));
  }

  // exposed for QA / OG rendering only
  window.__bw = { renderArtifact };
})();
</script>
