<body>
<main id="app">

  <section class="screen on" id="s-intro">
    <div class="lang" role="group" aria-label="Language / Язык">
      <button type="button" id="langEn" lang="en">EN</button>
      <button type="button" id="langRu" lang="ru">RU</button>
    </div>
    <div class="ref" id="refBanner" hidden></div>
    <h1>BORN<br>WEIRD</h1>
    <p class="tag" data-i18n="tagline"></p>
    <p class="muted" data-i18n="subline"></p>
    <label for="dob" data-i18n="dobLabel"></label>
    <input type="date" id="dob" min="1900-01-01" autocomplete="bday">
    <div class="err" id="dobErr" role="alert"></div>
    <button class="primary" id="btnStart" data-i18n="start"></button>
    <p class="small muted" data-i18n="privacy"></p>
  </section>

  <section class="screen" id="s-seed">
    <span class="bar" data-i18n="seedBar"></span>
    <div class="type cursor" id="seedText"></div>
    <button class="primary" id="btnSeed" disabled data-i18n="enter"></button>
  </section>

  <section class="screen" id="s-stage">
    <span class="bar" id="stageBar"></span>
    <h2 id="stagePrompt" tabindex="-1"></h2>
    <div id="stageOpts"></div>
  </section>

  <section class="screen" id="s-compile">
    <span class="bar" data-i18n="compileBar"></span>
    <p id="compileText" data-i18n="compileText"></p>
    <div class="progress"><i id="compileBar"></i></div>
  </section>

  <section class="screen" id="s-result">
    <span class="bar" id="resBar"></span>
    <h2 id="resTitle" tabindex="-1"></h2>
    <img class="artifact" id="artifact" alt="BORN WEIRD">
    <p class="small muted" data-i18n="unique"></p>
    <button class="primary" id="btnShare" data-i18n="share"></button>
    <div class="row">
      <button class="ghost" id="btnSave" data-i18n="save"></button>
      <button class="ghost" id="btnCopyLink" data-i18n="copyLink"></button>
    </div>

    <div class="section">
      <h2 data-i18n="hFuture"></h2>
      <p id="resFuture"></p>
      <ol class="tl" id="resEvents"></ol>
    </div>

    <div class="section">
      <h2 data-i18n="hUseful"></h2>
      <p><span class="tag" data-i18n="project"></span> <span id="resProject"></span></p>
      <p><span class="tag" data-i18n="experiment"></span> <span id="resExperiment"></span></p>
    </div>

    <div class="section">
      <h2 data-i18n="hSeed"></h2>
      <p class="muted"><span data-i18n="seedDesc"></span> <span class="tag" data-i18n="seedQ"></span></p>
      <div class="row">
        <button id="btnCopySeed" data-i18n="copySeed"></button>
        <button id="btnDlSeed" data-i18n="dlSeed"></button>
      </div>
      <pre class="seed" id="seedPre"></pre>
    </div>

    <div class="section" id="fb">
      <h2 data-i18n="fbWorth"></h2>
      <div class="row" id="fbWorth"></div>
      <h2 style="margin-top:16px" data-i18n="fbFeel"></h2>
      <div class="row" id="fbFeel"></div>
      <h2 style="margin-top:16px" data-i18n="fbSend"></h2>
      <div class="row" id="fbSend"></div>
      <p class="muted small" id="fbThanks" hidden data-i18n="fbThanks"></p>
    </div>

    <button class="ghost" id="btnAgain" style="margin-top:28px" data-i18n="again"></button>
  </section>

  <footer>
    <span data-i18n="footer"></span> <a href="https://github.com/dimacloud/born-weird" rel="noopener" data-i18n="builtPublic"></a>.
  </footer>
</main>
<div class="toast" id="toast"></div>

<script src="engine.js"></script>

      footer: 'BORN WEIRD — эксперимент, который ведёт компания из ИИ-агентов. Ничто здесь не является предсказанием или наукой. Без аккаунтов, без cookies, без сторонних трекеров (браузер хранит только ID созданных тобой реальностей, чтобы твои же ссылки не считались приглашениями); в публичный сервис уходят только анонимные счётчики событий (например, «симуляция пройдена»).',

  const store0 = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  let lang = (function () {
    const q = params.get('lang');
    if (q === 'en' || q === 'ru') return q;
    const entry = document.documentElement.getAttribute('data-lang');
    if (entry === 'en' || entry === 'ru') return entry;
    const saved = store0('bw_lang');
    if (saved === 'en' || saved === 'ru') return saved;
    return RU_LOCALES.test(navigator.language || '') ? 'ru' : 'en';
  })();
  const t = k => UI[lang][k];
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = UI[lang][el.getAttribute('data-i18n')]; });

    get(k, s) { try { return (s ? sessionStorage : localStorage).getItem(k); } catch (e) { return null; } },

    del(k, s) { try { (s ? sessionStorage : localStorage).removeItem(k); } catch (e) {} },

  // ---------- analytics: anonymous counters only ----------

  const NS = 'bw-x7q2-p0';
  if (params.get('founder') === '1') store.set('bw_founder', '1');
  if (params.get('founder') === '0') store.del('bw_founder');

  if (params.get('qa') === '0') store.del('bw_qa');
  const isFounder = store.get('bw_founder') === '1';
  const isQA = store.get('bw_qa') === '1'; // test traffic: never counted
  const fired = new Set();
  function track(ev, opts) {
    opts = opts || {};
    if (isQA) return;
    const keys = [ev];
    if (lang === 'ru' && RU_TRACKED.test(ev)) keys.push('ru_' + ev); // language segment for EXP-002
    keys.forEach(k0 => {
      const key = isFounder ? 'founder_' + k0 : k0;
      if (!opts.repeat) { if (fired.has(key)) return; fired.add(key); }
      sendQ.push(key);
    });
    pump();
  }
  // Only events that operations/metrics.mjs reads for the RU segment get a ru_ copy.

  // ---------- artifact renderer: LOST DOS GAME protocol ----------

  function fontReady(l) {

  function drawScene(res) {
    const W = 180, H = 110;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const r = BW.rng(res.artSeed);
    const P = PALETTES[res.primary];
    // banded sky
    const bands = P.sky.length;
    for (let i = 0; i < bands; i++) {
      x.fillStyle = P.sky[i];
      const y0 = Math.floor(i * 70 / bands), y1 = Math.floor((i + 1) * 70 / bands);
      x.fillRect(0, y0, W, y1 - y0 + 1);
      // dithered transition rows
      x.fillStyle = P.sky[Math.min(i + 1, bands - 1)];
      for (let px = (i % 2); px < W; px += 2) x.fillRect(px, y1 - 1, 1, 1);
    }
    // stars
    const nStars = 30 + Math.floor(r() * 50);
    for (let i = 0; i < nStars; i++) {
      x.fillStyle = r() < 0.2 ? P.acc : '#ffffff';
      x.fillRect(Math.floor(r() * W), Math.floor(r() * 40), 1, 1);
    }
    // sun / moons (weird worlds get two)
    const moons = 1 + (r() < 0.45 ? 1 : 0);
    for (let k = 0; k < moons; k++) {
      const cx = 20 + Math.floor(r() * 140), cy = 12 + Math.floor(r() * 30), rad = k ? 3 + Math.floor(r() * 3) : 7 + Math.floor(r() * 7);
      x.fillStyle = k ? P.acc : P.sun;
      for (let yy = -rad; yy <= rad; yy++) for (let xx = -rad; xx <= rad; xx++) if (xx * xx + yy * yy <= rad * rad) x.fillRect(cx + xx, cy + yy, 1, 1);
      if (!k && r() < 0.6) { // stripes through the sun, synthwave style
        x.fillStyle = P.sky[2];
        for (let s = 2; s < rad; s += 3) x.fillRect(cx - rad, cy + s, rad * 2 + 1, 1);
      }
    }
    // mountain layers (midpoint displacement)
    function ridge(base, amp, rough) {
      const pts = new Array(W + 1).fill(0);
      let step = 64; pts[0] = base + (r() - .5) * amp;
      for (let i = 0; i <= W; i += step) pts[i] = base + (r() - .5) * amp;
      let a = amp;
      while (step > 1) {
        const h = step / 2;
        for (let i = h; i <= W; i += step) {
          const L = pts[i - h], R = pts[Math.min(i + h, W)] !== 0 ? pts[Math.min(i + h, W)] : L;
          pts[i] = (L + R) / 2 + (r() - .5) * a;
        }
        a *= rough; step = h;
      }
      return pts.map(v => Math.round(v));
    }
    const layers = [ridge(52, 26, 0.55), ridge(66, 18, 0.5), ridge(80, 10, 0.5)];
    layers.forEach((pts, li) => {
      x.fillStyle = P.m[li];
      for (let i = 0; i < W; i++) x.fillRect(i, pts[i], 1, H - pts[i]);
    });
    // ground grid
    x.fillStyle = P.g; x.fillRect(0, 88, W, H - 88);
    x.fillStyle = P.acc;
    for (let gy = 88, k = 1; gy < H; gy += k, k++) x.fillRect(0, gy, W, 1);
    for (let gx = -200; gx < 380; gx += 22) { // perspective lines
      for (let gy = 88; gy < H; gy++) {
        const t = (gy - 88) / (H - 88);
        x.fillRect(Math.round(90 + (gx - 90) * (0.15 + t)), gy, 1, 1);
      }
    }
    // landmark per primary dimension
    const lx = 110 + Math.floor(r() * 50), ly = 88;
    const S = (dx, dy, w, h, col) => { x.fillStyle = col; x.fillRect(lx + dx, ly + dy, w, h); };
    const dark = '#000000', lit = P.acc;
    switch (res.primary) {
      case 'POWER': S(-4, -46, 9, 46, dark); S(-2, -54, 5, 8, dark); S(0, -60, 1, 6, lit);
        for (let w = -40; w < -2; w += 5) S(-2, w, 1, 2, lit), S(2, w, 1, 2, lit); break;
      case 'SECURITY': S(-10, -14, 21, 14, dark); S(-6, -18, 13, 4, dark); S(-1, -8, 3, 8, lit); S(-12, -2, 25, 2, dark); break;
      case 'CURIOSITY': S(-3, -36, 7, 36, dark); S(-5, -40, 11, 4, dark); S(-2, -38, 5, 2, lit);
        x.fillStyle = lit; for (let b = 1; b < 60; b++) x.fillRect(lx + 4 + b, ly - 39 + Math.round(b * -0.25), 1, 1); break;
      case 'CREATION': S(-8, -10, 17, 10, dark); S(-3, -24, 7, 14, dark); S(-12, -30, 2, 30, dark); S(-12, -30, 14, 2, dark); S(1, -20, 2, 2, lit); S(-6, -6, 2, 2, lit); S(4, -6, 2, 2, lit); break;
      case 'CONNECTION': for (let h = -24; h <= 16; h += 10) { S(h, -8, 8, 8, dark); S(h + 1, -11, 6, 3, dark); S(h + 3, -5, 2, 2, lit); }
        S(-26, -1, 50, 1, lit); break;
      case 'AUTONOMY': x.fillStyle = dark; for (let i = 0; i < 9; i++) x.fillRect(lx - i, ly - 4 - i, 2 * i + 1, 1);
        S(0, -3, 1, 3, lit); x.fillStyle = lit; for (let rd = 0; rd < 22; rd++) x.fillRect(lx - 30 + rd * 2, H - 1 - Math.floor(rd * 0.9), 2, 1); break;
    }
    // the player, small, facing the landmark
    const px = lx - 26 - Math.floor(r() * 20), py = 88;
    x.fillStyle = '#ffffff'; x.fillRect(px, py - 7, 2, 2); x.fillStyle = P.acc; x.fillRect(px - 1, py - 5, 4, 3);
    x.fillStyle = '#ffffff'; x.fillRect(px, py - 2, 1, 2); x.fillRect(px + 2, py - 2, 1, 2);
    // corruption: a few shifted rows (signal from a reality that never existed)
    const glitches = 2 + Math.floor(r() * 4);
    for (let i = 0; i < glitches; i++) {
      const gy = Math.floor(r() * H), gh = 1 + Math.floor(r() * 3), off = Math.floor((r() - .5) * 24);
      const row = x.getImageData(0, gy, W, gh); x.putImageData(row, off, gy);
    }
    return c;
  }

  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let cur = '';
    words.forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  async function renderArtifact(res) {
    const L = res.lang === 'ru' ? 'ru' : 'en', A = UI[L].art;
    await fontReady(L);
    const W = 1080, H = 1350;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const P = PALETTES[res.primary];
    // Tiny5 (Cyrillic) is ~1.5x wider than VT323, so Russian sizes are scaled down.
    const F = L === 'ru' ? (px) => Math.round(px * 0.68) + 'px Tiny5, VT323, ui-monospace, monospace' : (px) => px + 'px VT323, ui-monospace, Menlo, monospace';
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);

    // title bar
    x.fillStyle = '#0000aa'; x.fillRect(0, 0, W, 64);
    x.fillStyle = '#ffffff'; x.font = F(40); x.textBaseline = 'middle';
    x.fillText('BORN_WEIRD.EXE', 24, 34);
    x.textAlign = 'right'; x.fillText(res.protocol + ' // ' + res.earth, W - 24, 34); x.textAlign = 'left';

    // scene, scaled with hard pixels
    const scene = drawScene(res);
    x.imageSmoothingEnabled = false;
    x.drawImage(scene, 0, 64, W, 660);

    // title over the sky
    x.font = F(92); x.textBaseline = 'top';
    const tl = wrap(x, res.title, W - 120).slice(0, 4);
    let ty = 104;
    const lh = L === 'ru' ? 76 : 82;
    tl.forEach(line => {
      const tw = x.measureText(line).width, tx = (W - tw) / 2;
      x.fillStyle = '#000'; x.fillText(line, tx + 6, ty + 6);
      x.fillStyle = '#ffff55'; x.fillText(line, tx, ty);
      ty += lh;
    });

    // panel
    const py = 724;
    x.fillStyle = '#000'; x.fillRect(0, py, W, H - py);
    x.strokeStyle = P.acc; x.lineWidth = 4; x.strokeRect(14, py + 14, W - 28, H - py - 28);
    x.lineWidth = 2; x.strokeRect(24, py + 24, W - 48, H - py - 48);

    // stats
    x.font = F(36); x.textBaseline = 'top';
    const labelW = Math.max(...res.scores.map(s => x.measureText(s.label).width)) + 22;
    const barX = Math.max(200, labelW);
    res.scores.forEach((s, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const sx = 60 + col * 500, sy = py + 54 + row * 50;
      x.fillStyle = s.dim === res.primary ? '#ffff55' : s.dim === res.rejected ? '#666' : '#c8ffc8';
      x.fillText(s.label, sx, sy + (L === 'ru' ? 6 : 0));
      const n = Math.max(0, Math.round(s.norm * 10));
      const step = Math.min(22, Math.floor((470 - barX) / 10));
      for (let b = 0; b < 10; b++) {
        x.fillStyle = b < n ? (s.dim === res.primary ? '#ffff55' : P.acc) : '#222';
        x.fillRect(sx + barX + b * step, sy + 8, step - 4, 22);
      }
    });

    // dialog box
    const dy = py + 220;
    x.fillStyle = '#0000aa'; x.fillRect(60, dy, W - 120, 236);
    x.strokeStyle = '#ffffff'; x.lineWidth = 3; x.strokeRect(68, dy + 8, W - 136, 220);
    x.fillStyle = '#55ffff'; x.font = F(34);
    const last = res.events[res.events.length - 1];
    x.fillText(A.child(last.year), 92, dy + 28);
    x.fillStyle = '#ffffff'; x.font = F(44);
    wrap(x, '> ' + res.finalLine, W - 200).slice(0, 2).forEach((l, i) => x.fillText(l, 92, dy + 76 + i * (L === 'ru' ? 40 : 46)));
    x.fillStyle = '#ffff55'; x.font = F(32);
    x.fillText(A.kept(res.labels[res.primary], res.labels[res.rejected]), 92, dy + 176);

    // footer
    x.font = F(34); x.fillStyle = '#c8ffc8';
    x.fillText(UI[L].reality + ' #' + res.id + '   ' + A.born(res.birth.weekday, res.birth.weekdayNom), 60, H - 152);
    x.fillStyle = '#6a8f6a'; x.font = F(30);
    x.fillText(A.note, 60, H - 112);
    x.fillStyle = '#ffff55'; x.font = F(30);
    x.fillText('dimacloud.github.io/born-weird' + (L === 'ru' ? '/ru' : ''), 60, H - 74);

    // scanlines
    x.fillStyle = 'rgba(0,0,0,0.18)';
    for (let yy = 0; yy < H; yy += 4) x.fillRect(0, yy, W, 2);

    return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
  }

  // expose for QA / OG rendering only
  window.__bw = { renderArtifact, track: () => {} };
})();
