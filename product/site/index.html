<body>
<div class="top">
  <span>BORN_WEIRD.EXE</span><span class="sp"></span>
  <span id="langBox"><button type="button" id="langEn" lang="en">EN</button><button type="button" id="langRu" lang="ru">RU</button></span>
  <button type="button" id="btnSound" aria-pressed="true"></button>
</div>
<main id="app">

  <section class="screen on" id="s-intro">
    <div class="ref" id="refBanner" hidden></div>
    <div class="stat" id="spawnStat" hidden></div>
    <h1>BORN<br>WEIRD</h1>
    <p class="tag" data-i18n="tagline"></p>
    <p class="muted" data-i18n="subline"></p>
    <label for="dob" data-i18n="dobLabel"></label>
    <input type="date" id="dob" min="1900-01-01" autocomplete="bday">
    <div class="err" id="dobErr" role="alert"></div>
    <button class="primary" id="btnStart" data-i18n="start"></button>
    <p class="small muted" data-i18n="privacy"></p>
  </section>

  <section class="screen" id="s-birth">
    <span class="bar" data-i18n="birthBar"></span>
    <h2 id="birthWeeks" tabindex="-1"></h2>
    <div class="life" id="lifeGrid" aria-hidden="true"></div>
    <p class="small muted" id="lifeCaption"></p>
    <div class="box"><span class="hi" id="milestone"></span><br><span class="small muted" data-i18n="milestoneWhy"></span></div>
    <div class="box"><span id="stage"></span></div>
    <p id="world" class="muted"></p>
    <h3 data-i18n="symbolHead"></h3>
    <div class="box" id="symbol"></div>
    <p class="small tag" data-i18n="motto"></p>
    <button class="primary" id="btnBirth" data-i18n="toModel"></button>
  </section>

  <section class="screen" id="s-model">
    <span class="bar" data-i18n="modelBar"></span>
    <h2 data-i18n="modelHead" tabindex="-1"></h2>
    <div class="poles" id="poles"></div>
    <p data-i18n="howTo"></p>
    <p class="small muted" data-i18n="caveat"></p>
    <button class="primary" id="btnModel" data-i18n="begin"></button>
  </section>

  <section class="screen" id="s-item">
    <span class="bar" id="itemBar"></span>
    <p class="small tag" id="itemBirth" hidden></p>
    <h2 id="itemPrompt" tabindex="-1"></h2>
    <p class="hint" id="itemHint" aria-live="polite"></p>
    <div id="itemOpts"></div>
    <div id="itemOut" hidden>
      <div class="react type" id="itemReact"></div>
      <div class="deltas" id="itemDeltas"></div>
      <div class="hud" id="hud"></div>
      <button class="primary" id="btnNext"></button>
    </div>
  </section>

  <section class="screen" id="s-bridge">
    <span class="bar" data-i18n="bridgeBar"></span>
    <h2 id="bridgePrompt" tabindex="-1"></h2>
    <div class="bridge" id="bridgeOpts"></div>
    <div class="scale"><span id="bridgeLow"></span><span id="bridgeHigh"></span></div>
  </section>

  <section class="screen" id="s-compile">
    <span class="bar" data-i18n="compileBar"></span>
    <p data-i18n="compileText"></p>
    <div class="progress"><i id="compileBar"></i></div>
  </section>

  <section class="screen" id="s-result">
    <span class="bar" id="resBar"></span>
    <h2 id="resTitle" tabindex="-1"></h2>
    <p><span class="okc">+ </span><span id="resPlus"></span><br><span class="noc">− </span><span id="resShadow"></span></p>
    <img class="artifact" id="artifact" alt="BORN WEIRD">
    <p class="small muted center" id="saveHint"></p>
    <button class="primary" id="btnShare" data-i18n="share"></button>
    <div class="row">
      <button class="ghost" id="btnSave" data-i18n="save"></button>
      <button class="ghost" id="btnCopyLink" data-i18n="copyLink"></button>
    </div>
    <p class="small muted" data-i18n="keyExplain"></p>

    <div class="section">
      <h3 data-i18n="hProfile"></h3>
      <p class="hi" id="resOrder"></p>
      <div class="prof" id="resProfile"></div>
      <h3 data-i18n="hTension"></h3>
      <p><b class="hi" id="resTensionShort"></b><br><span id="resTension"></span></p>
      <h3 data-i18n="hBlind"></h3>
      <p id="resBlind"></p>
      <h3 id="resBridgeHead"></h3>
      <p id="resBridge"></p>
      <h3 data-i18n="hQuest"></h3>
      <p id="resQuest"></p>
      <p class="tag small" id="resStart"></p>
    </div>

    <div class="section">
      <h3 data-i18n="hAI"></h3>
      <p class="muted small" data-i18n="aiExplain"></p>
      <div class="row" role="group" aria-label="AI">
        <button type="button" id="aiChatgpt">ChatGPT</button>
        <button type="button" id="aiClaude">Claude</button>
      </div>
      <a class="btn" id="aiPlan" target="_blank" rel="noopener"></a>
      <a class="btn" id="aiTension" target="_blank" rel="noopener"></a>
      <a class="btn" id="aiFuture" target="_blank" rel="noopener"></a>
      <details>
        <summary data-i18n="seedMore"></summary>
        <p class="muted small" data-i18n="seedDesc"></p>
        <div class="row">
          <button id="btnCopySeed" data-i18n="copySeed"></button>
          <button id="btnDlSeed" data-i18n="dlSeed"></button>
        </div>
        <pre class="seed" id="seedPre"></pre>
      </details>
    </div>

    <div class="section">
      <div class="stat" id="retake"></div>
      <p class="small muted" data-i18n="caveat"></p>
      <details>
        <summary data-i18n="myChoices"></summary>
        <ol class="tl" id="resChoices"></ol>
      </details>
    </div>

    <div class="section" id="fb">
      <h3 data-i18n="fbWorth"></h3>
      <div class="row" id="fbWorth"></div>
      <h3 data-i18n="fbTrue"></h3>
      <div class="row" id="fbTrue"></div>
      <h3 data-i18n="fbSend"></h3>
      <div class="row" id="fbSend"></div>
      <p class="muted small" id="fbThanks" hidden data-i18n="fbThanks"></p>
    </div>

    <button class="ghost" id="btnAgain" style="margin-top:28px" data-i18n="again"></button>
  </section>

  <footer>
    <span data-i18n="footer"></span> <a href="https://github.com/dimacloud/born-weird" rel="noopener" data-i18n="builtPublic"></a>.
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="engine.js"></script>

    });
    x.font = T(40); x.fillStyle = '#55ffff'; x.fillText(A.bridge, 60, y + (L === 'ru' ? 6 : 0));
    for (let i = 0; i < 7; i++) { x.strokeStyle = '#55ffff'; x.lineWidth = 3; x.fillStyle = i < res.bridge ? '#55ffff' : '#000'; x.fillRect(280 + i * 52, y + 6, 40, 32); x.strokeRect(280 + i * 52, y + 6, 40, 32); }

    if (res.rarity) { x.font = T(40); x.fillStyle = '#ffff55'; x.fillText(A.rare(res.rarity), 60, y); y += 50; }

    x.textAlign = 'right'; x.fillStyle = '#ffff55'; x.fillText('dimacloud.github.io/born-weird' + (L === 'ru' ? '/ru' : ''), W - 60, fy); x.textAlign = 'left';
