<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BORN WEIRD · LAB</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="lab.css">
<style>
  h1 { color: var(--hi); font-size: 28px; margin: 8vh 0 6px; letter-spacing: 2px; text-shadow: 3px 3px 0 var(--mg); }
  p { margin: 0 0 18px; }
  .g { display: block; margin: 12px 0; padding: 18px 16px; border: 2px solid var(--fg); color: var(--fg); text-decoration: none; font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  .g:active, .g:hover { background: var(--fg); color: #000; }
  .g small { display: block; font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--dim); }
</style>
</head>
<body>
<main>
  <div class="lab-brand">BORN WEIRD · LAB</div>
  <h1>ШАР · РАУНД 2</h1>
  <p>Та же игра, два разных финала. Сыграй оба. Скажи, после какого финала хочется кому-то отправить.</p>
  <div id="list"></div>
  <p class="lab-muted">Каждый — около минуты. Ничего не сохраняется, никаких аккаунтов.</p>
</main>
<script>
  // Round 2 (DECISION #020): one game, two reveal variants; random order, numbers only.
  // B and C stay reachable by direct link but are off the hub (retired / parked).
  const games = ['1', '2'];
  for (let i = games.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [games[i], games[j]] = [games[j], games[i]]; }
  const keep = new URLSearchParams(location.search);
  const q = ['f', 'qa'].filter(k => keep.get(k) === '1').map(k => '&' + k + '=1').join('');
  document.getElementById('list').innerHTML = games.map((v, i) =>
    `<a class="g" href="a/?v=${v}${q}">ФИНАЛ ${v === '1' ? 'X' : 'Y'}<small>${i + 1}-й по порядку</small></a>`).join('');
</script>
</body>
</html>
